<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hospital Management System</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <h1>Hospital Management System</h1>

    <section class="card">
      <h2>Add Patient</h2>
      <form id="patient-form">
        <input id="patient-name" placeholder="Patient name" required />
        <input id="patient-age" type="number" min="0" placeholder="Age" required />
        <input id="patient-illness" placeholder="Illness" required />
        <button type="submit">Save Patient</button>
      </form>
    </section>

    <section class="card">
      <h2>Add Doctor</h2>
      <form id="doctor-form">
        <input id="doctor-name" placeholder="Doctor name" required />
        <input id="doctor-specialization" placeholder="Specialization" required />
        <button type="submit">Save Doctor</button>
      </form>
    </section>

    <section class="card">
      <h2>Create Appointment</h2>
      <form id="appointment-form">
        <select id="appointment-patient" required></select>
        <select id="appointment-doctor" required></select>
        <input id="appointment-date" type="datetime-local" required />
        <button type="submit">Create Appointment</button>
      </form>
    </section>

    <section class="card">
      <h2>Patients</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Age</th><th>Illness</th></tr>
        </thead>
        <tbody id="patients-table"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Doctors</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Specialization</th></tr>
        </thead>
        <tbody id="doctors-table"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Appointments</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Patient ID</th><th>Doctor ID</th><th>Date/Time</th></tr>
        </thead>
        <tbody id="appointments-table"></tbody>
      </table>
    </section>

    <p id="status" role="status"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
